name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: tools.json 可解析、CSP hash 與 _headers 一致
        run: node tools/check-portal.js

      - name: check-portal 守門力（每個錯誤實作都必須 fail）
        run: node tests/check-portal-mutations.mjs

      - name: gen-seo 產出與 commit 一致
        run: |
          node tools/gen-seo.js
          git diff --exit-code -- public/index.html public/sitemap.xml \
            || { echo '::error::SEO 檔與 tools.json 不同步：請跑 node tools/gen-seo.js 後 commit'; exit 1; }

      - name: shell 檔變動時 sw.js CACHE 必須升版
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node tools/check-cache-bump.js "$BASE"

      - name: Install pinned pharmacy test dependencies
        run: npm ci

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Reproducible Three.js vendor
        run: npm run check:three

      - name: Pharmacy WebGL smoke
        run: npm run test:pharmacy

      - name: Pharmacy idle rendering and interaction wake-up
        run: npm run test:pharmacy:performance

      - name: Pharmacy free ground navigation
        run: npm run test:pharmacy:free

      - name: Pharmacy author hub, Escape and history polish
        run: npm run test:pharmacy:polish

      - name: Service worker cache ownership
        run: node tools/check-sw-cache-scope.js
