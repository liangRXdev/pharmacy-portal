  <link rel="canonical" href="https://pharmacy-portal.liangrxdev.workers.dev/pharmacy/">
  <meta property="og:title" content="3D 藥局｜梁哲嘉藥師 Clinical Pharmacy Toolkit">

</head>
<body>
  <header class="site-header">
    <div><p class="eyebrow">LIANG · CLINICAL PHARMACY TOOLKIT</p><h1>3D 藥局探索</h1></div>
    <a href="/">工具總覽 ↗</a>
  </header>
  <main>
    <section class="scene-shell" aria-label="藥局工作區全景">
      <div class="scene-caption"><span class="eyebrow">FIVE ZONES · ONE PHARMACY</span><h2 id="scene-title" aria-live="polite">選擇工作區開始探索</h2><p id="scene-help">藥師會帶你前往，抵達後即可查看工具。</p><p id="scene-secondary" class="scene-secondary">也可以點選地面自由移動。</p></div>
      <div class="scene-actions"><button id="overview" type="button">返回全景</button> <button id="explore" type="button" aria-controls="detail" aria-expanded="false" hidden>Rx Hub · 關於作者</button></div>
      <div id="world" role="group" aria-label="3D 藥局互動地圖" aria-describedby="scene-help"></div>
      <p id="status" role="status">3D 藥局準備中…</p>
      <div id="fallback" hidden><p>此裝置目前無法啟動 3D 藥局。你仍可瀏覽全部工具。</p><button id="browse-tools" type="button">瀏覽工具</button> <button id="retry" type="button">重新載入 3D</button></div>
    </section>
    <div id="backup-browser" hidden>
    <nav id="categories" aria-label="備援工具分類"></nav>
    <section id="browser" aria-labelledby="list-title" tabindex="-1">
      <div class="section-heading"><div><p class="eyebrow">TOOL DIRECTORY</p><h2 id="list-title">全部工具</h2></div><span id="count"></span></div>
      <div id="tools" class="tool-list"></div>
    </section>
    </div>
    <aside id="detail" role="dialog" aria-modal="false" aria-labelledby="detail-title" hidden>
      <button id="close-detail" type="button" aria-label="關閉工具詳情">關閉 ✕</button>
      <div id="detail-content"></div>
    </aside>
    <noscript><p>請啟用 JavaScript 瀏覽互動藥局，或<a href="/">回到工具總覽</a>。</p></noscript>
  </main>
  <footer>梁哲嘉藥師 · 五個藥學工作領域，一個工具入口。</footer>
