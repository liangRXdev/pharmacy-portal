<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=block">
<style>
  :root {
    --bg-primary: #F5F0E8;
    --accent-hover: #2E6B7A;
    --text-primary: #2C2C2C;
    --border: #E0D9CE;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Noto Sans TC', sans-serif;
    padding: 88px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-left: 16px solid var(--accent-hover);
  }
  .og__icon { width: 96px; height: 96px; border-radius: 20px; display: block; }
  .og__title { font-size: 80px; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em; }
  .og__scope { margin-top: 24px; font-size: 36px; font-weight: 500; color: var(--accent-hover); }
  .og__author {
    padding-top: 24px;
    border-top: 2px solid var(--border);
    font-size: 30px;
  }
</style>
</head>
<body>
  <img class="og__icon" src="../public/icons/icon-512.png" alt="">
  <main>
    <h1 class="og__title">個人臨床藥學工具集</h1>
    <p class="og__scope">劑量計算・實證醫學・藥物安全・TFDA 查詢</p>
  </main>
  <p class="og__author">臨床藥師 梁哲嘉</p>
</body>
</html>
